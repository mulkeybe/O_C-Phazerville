name: Manual build full Phazerville

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.branch }}
        submodules: recursive

    - name: Setup env
      run: |
        echo "OC_ARTIFACT_TAG=manual-${{ inputs.branch }}-$(git rev-parse --short HEAD)" | tr '/' '_' >> $GITHUB_ENV

    - name: Cache PlatformIO
      uses: actions/cache@v5
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        cache: 'pip'
        cache-dependency-path: '**/requirements.txt'

    - run: |
        pip3 install --upgrade pip
        pip3 install -r .github/workflows/requirements.txt

    - name: Build full firmware
      working-directory: software/
      run: |
        pio run

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v7
      with:
        name: o_C-full-${{ inputs.branch }}-${{ github.run_number }}
        include-hidden-files: true
        path: |
          software/*.hex
          software/.pio/build/*/*.hex
